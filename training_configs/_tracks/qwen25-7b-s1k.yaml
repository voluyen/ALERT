defaults:
  - ../_common/base.yaml
  - ../_common/models/qwen25-7b.yaml
  - ../_common/data/s1k.yaml
  - ../_common/train/lora-r16.yaml
  - ../_common/eval/palign-protocol.yaml
track: qwen25-7b
lora_adapter: true
run:
  gpus: [0, 1]
stages:
  prepare:
    args:
      enable-thinking: false
  train:
