defaults: [_allocation.yaml, _answer_gain_ablation_paths.yaml]
signal_parquet: ${predictability_signal}
train_variant: ${name}
pipeline: [prepare, predictability, score_signal, weights, train, eval]
stages:
  predictability:
    module: answergain.signals.predictability
    creates: ${predictability_scores}
    args:
      data-path: ${data_dir}/train-segmented.jsonl
      model: ${model.name}
      output: ${predictability_scores}
      chunk-size: 1024
  score_signal:
    module: answergain.signals.gain_parquet
    creates: ${predictability_signal}
    args:
      data-path: ${data_dir}/train-segmented.jsonl
      gains: ${predictability_scores}
      output: ${predictability_signal}
