defaults: [_capture.yaml]
energy_threshold_p: 0.95
train_variant: spectral
pipeline: [prepare, capture, masks, train, eval]
stages:
  masks:
    module: answergain.selection.build_masks
    creates: ${data_dir}/train-spectral.jsonl
    args:
      data-path: ${data_dir}/train-segmented.jsonl
      strengths: ${data_dir}/spectral-strengths.parquet
      energy-threshold-p: ${energy_threshold_p}
