defaults:
  - ../../_common/base.yaml
  - ../../_common/models/qwen25-7b.yaml
  - ../../_common/data/palign-966.yaml
  - _llamafactory-format.yaml
  - _lora.yaml
  - ../../_common/eval/palign-protocol.yaml
  - _palign.yaml
run_suffix: -rebuilt
track: palign-${model.key}-rebuilt
stop_suffix: "\n"
build_dir: data/palign-build/${model.key}
dataset: ${build_dir}/palign_sft.json
pipeline: [traces, truncate, align, build, prepare, vanilla, train, eval]
stages:
  traces:
    module: answergain.data.s1k
    creates: ${build_dir}/traces.jsonl
    args:
      dataset: baesad/s1K-1.1-deepseek-cot
      trace-field: deepseek_thinking_trajectory
      segment-mode: none
      output: ${build_dir}/traces.jsonl
  truncate:
    module: answergain.palign.truncate
    creates: ${build_dir}/truncated.jsonl
    args:
      model: ${model.name}
      input: ${build_dir}/traces.jsonl
      output: ${build_dir}/truncated.jsonl
      backend: vllm
      max-new-tokens: 256
  align:
    module: answergain.palign.align
    creates: ${build_dir}/aligned.jsonl
    args:
      model: ${model.name}
      input: ${build_dir}/truncated.jsonl
      output: ${build_dir}/aligned.jsonl
      max-tokens: 32768
      temperature: 0.6
      top-p: 0.9
      repetition-penalty: 1.05
  build:
    module: answergain.palign.build
    creates: ${dataset}
    args:
      aligned: ${build_dir}/aligned.jsonl
      truncated: ${build_dir}/truncated.jsonl
      output: ${dataset}
